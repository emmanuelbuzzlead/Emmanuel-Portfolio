<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmanuel Nnamso — GTM Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f2ec;
  --ink:      #0f0e0c;
  --ink-2:    #3a3830;
  --ink-3:    #8a8679;
  --rule:     rgba(15,14,12,0.1);
  --accent:   #d4522a;
  --accent-2: #1a3a2e;
  --surface:  #ffffff;
  --surface-2:#ede9e1;
  --f-display: 'Bebas Neue', sans-serif;
  --f-body:    'DM Sans', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
}

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 40px; }

/* Header */
header { padding: 48px 0 0; border-bottom: 1px solid var(--rule); }

.header-inner {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-bottom: 32px;
  gap: 24px;
}

.header-left { flex: 1; }

.header-label {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}

.header-name {
  font-family: var(--f-display);
  font-size: clamp(3.5rem, 8vw, 7rem);
  line-height: 0.9;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.header-name span { color: var(--accent); }

.header-right { text-align: right; flex-shrink: 0; }

.header-title {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--ink-2);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.header-contact {
  font-size: 0.82rem;
  color: var(--ink-3);
  line-height: 1.8;
}

.header-contact a { color: var(--accent); text-decoration: none; font-weight: 500; }

/* Aggregate */
.aggregate {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--rule);
}

.agg-item {
  padding: 28px 0;
  border-right: 1px solid var(--rule);
  opacity: 0;
  animation: fadeUp 0.5s ease forwards;
}

.agg-item:last-child { border-right: none; }
.agg-item:nth-child(1) { animation-delay: 0.1s; }
.agg-item:nth-child(2) { animation-delay: 0.2s; }
.agg-item:nth-child(3) { animation-delay: 0.3s; }
.agg-item:nth-child(4) { animation-delay: 0.4s; }

.agg-num {
  font-family: var(--f-display);
  font-size: 3.2rem;
  line-height: 1;
  color: var(--ink);
  letter-spacing: 0.02em;
}

.agg-num sup {
  font-family: var(--f-body);
  font-size: 1rem;
  font-weight: 500;
  vertical-align: super;
  color: var(--accent);
}

.agg-label {
  font-size: 0.73rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
  margin-top: 4px;
}

/* Section head */
.section-head {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 48px 0 28px;
}

.section-num {
  font-family: var(--f-display);
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: 0.1em;
}

.section-title {
  font-family: var(--f-display);
  font-size: 1.6rem;
  letter-spacing: 0.06em;
  color: var(--ink);
}

.section-rule { flex: 1; height: 1px; background: var(--rule); }

/* Cases */
.cases { display: flex; flex-direction: column; gap: 2px; margin-bottom: 2px; }

/* Brand color variables */
.case[data-brand="interdependence"] { --brand-c: #e83a2e; }
.case[data-brand="lumion"]          { --brand-c: #00c9a7; }
.case[data-brand="productevo"]      { --brand-c: #2563eb; }

.case {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-left: 4px solid var(--brand-c, var(--accent));
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.5s ease forwards;
  position: relative;
}

.case-identity {
  background: linear-gradient(135deg, rgba(var(--brand-rgb, 212,82,42), 0.04) 0%, transparent 70%);
}

.case:nth-child(1) { animation-delay: 0.15s; }
.case:nth-child(2) { animation-delay: 0.25s; }
.case:nth-child(3) { animation-delay: 0.35s; }

.case-top {
  display: grid;
  grid-template-columns: 260px 1fr auto;
  gap: 0;
  border-bottom: 1px solid var(--rule);
}

.case-identity {
  padding: 28px;
  border-right: 1px solid var(--rule);
  position: relative;
}

.case-num {
  font-family: var(--f-display);
  font-size: 0.85rem;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  margin-bottom: 6px;
}

.case-client {
  font-family: var(--f-display);
  font-size: 1.8rem;
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--ink);
  margin-bottom: 8px;
}

.case-tag {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 3px 9px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-2);
  margin-bottom: 12px;
}

.case-domain {
  display: block;
  font-size: 0.72rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-top: 4px;
  transition: opacity 0.15s;
}

.case-domain:hover { opacity: 0.7; }

/* Screenshot thumbnail */
.case-screenshot {
  position: absolute;
  bottom: 14px;
  right: 14px;
  width: 88px;
  height: 60px;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}

.case-screenshot:hover {
  transform: scale(1.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.case-screenshot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top left;
  display: block;
}

.screenshot-hint {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(15,14,12,0.65);
  color: #fff;
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: center;
  padding: 3px 0;
}

/* Metrics row inside case-desc */
.case-desc-wrap {
  display: flex;
  flex-direction: column;
  padding: 0;
  border-right: 1px solid var(--rule);
}

.case-metrics {
  display: flex;
  border-bottom: 1px solid var(--rule);
}

.case-metric {
  flex: 1;
  padding: 14px 20px;
  border-right: 1px solid var(--rule);
}

.case-metric:last-child { border-right: none; }

.case-metric-num {
  font-family: var(--f-display);
  font-size: 1.4rem;
  color: var(--ink);
  letter-spacing: 0.03em;
  line-height: 1;
}

.case-metric-num span { color: var(--accent); font-family: var(--f-body); font-size: 0.75rem; font-weight: 600; }

.case-metric-label {
  font-size: 0.63rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin-top: 3px;
}

.case-desc {
  padding: 22px 28px;
  font-size: 0.88rem;
  color: var(--ink-2);
  line-height: 1.7;
  flex: 1;
}

@keyframes borderGlow {
  0% { box-shadow: 0 0 6px rgba(232, 58, 46, 0.4), inset 0 0 6px rgba(232, 58, 46, 0.2); }
  50% { box-shadow: 0 0 22px rgba(232, 58, 46, 0.85), inset 0 0 12px rgba(232, 58, 46, 0.4); }
  100% { box-shadow: 0 0 6px rgba(232, 58, 46, 0.4), inset 0 0 6px rgba(232, 58, 46, 0.2); }
}

.glowing-stat {
  animation: borderGlow 3s infinite ease-in-out;
}

.case-stat {
  padding: 28px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  min-width: 165px;
  background: var(--accent-2);
}

.case-stat-num {
  font-family: var(--f-display);
  font-size: 2.8rem;
  color: #fff;
  line-height: 1;
  letter-spacing: 0.03em;
  transition: opacity 0.25s ease;
}

.case-stat-label {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.6);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
  text-align: right;
  margin-top: 4px;
  line-height: 1.4;
  transition: opacity 0.25s ease;
}

.case-bottom {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.case-detail {
  padding: 18px 28px;
  border-right: 1px solid var(--rule);
}

.case-detail:last-child { border-right: none; }

.case-detail-label {
  font-size: 0.63rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 4px;
}

.case-detail-val {
  font-size: 0.83rem;
  color: var(--ink-2);
  line-height: 1.5;
  font-weight: 400;
}

/* Client grid */
.client-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 2px;
  margin-bottom: 60px;
}

.client-tile {
  background: var(--surface);
  border: 1px solid var(--rule);
  padding: 20px 22px;
  opacity: 0;
  animation: fadeUp 0.4s ease forwards;
  transition: background 0.15s;
}

.client-tile:hover { background: var(--surface-2); }
.client-tile:nth-child(1) { animation-delay: 0.1s; }
.client-tile:nth-child(2) { animation-delay: 0.16s; }
.client-tile:nth-child(3) { animation-delay: 0.22s; }
.client-tile:nth-child(4) { animation-delay: 0.28s; }
.client-tile:nth-child(5) { animation-delay: 0.34s; }
.client-tile:nth-child(6) { animation-delay: 0.40s; }

.tile-name {
  font-family: var(--f-display);
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  color: var(--ink);
  margin-bottom: 2px;
  line-height: 1.1;
}

.tile-vertical {
  font-size: 0.68rem;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 500;
  margin-bottom: 10px;
}

.tile-scope {
  font-size: 0.73rem;
  color: var(--ink-3);
  line-height: 1.5;
}

.tile-result {
  margin-top: 8px;
  font-size: 0.73rem;
  font-weight: 500;
  color: var(--accent);
}

.tile-domain {
  display: inline-block;
  margin-top: 10px;
  font-size: 0.7rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  border-bottom: 1px solid rgba(212,82,42,0.3);
  padding-bottom: 1px;
  transition: opacity 0.15s;
}

.tile-domain:hover { opacity: 0.7; }

/* Footer */
footer {
  border-top: 1px solid var(--rule);
  padding: 32px 0 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
